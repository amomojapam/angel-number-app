<body>
  <div id="star-field" class="star-field" aria-hidden="true"></div>
  <main class="app">
    <div class="screen">
      <p class="brand-eyebrow">TODAY'S ANGEL NUMBER</p>
      <h1 class="title-main">今日の<br />エンジェルナンバー</h1>
      <p class="lede" id="todayDateLabel">読み込んでいます…</p>

      <div id="todayContent"></div>

      <div class="panel" style="margin-top:8px; text-align:center;">
        <p class="lede" style="margin-bottom:14px;">気になる数字が他にもあれば、アプリで直接調べてみましょう。</p>
        <a class="btn-primary" href="index.html" style="text-decoration:none; display:inline-flex;">アプリでメッセージを受け取る →</a>
      </div>

      <p class="footer-note" style="margin-top:24px;">
        ✧ このページの数字とメッセージは、毎日0時に更新されます。<br />
        また明日、覗きに来てくださいね。
      </p>
      <p class="footer-note">
        <a href="guide.html" style="color:inherit;">✧ エンジェルナンバー一覧を見る</a>
      </p>
      <p class="footer-note">
        <a href="contact.html" style="color:inherit;">✧ お問い合わせ</a>
      </p>
      <p class="footer-note">🕊 本コンテンツはエンターテインメントを目的としています。医療・法律・投資などの専門的判断に代わるものではありません。</p>
    </div>
  </main>

  <script src="src/data/angelNumbers.js"></script>
  <script src="src/data/themes.js"></script>
  <script src="src/data/cards.js"></script>
  <script src="src/data/messageEngine.js"></script>
  <script src="src/components/motifIcons.js"></script>
  <script src="src/components/angelMascot.js"></script>
  <script src="src/components/sceneBackgrounds.js"></script>
  <script>
    (function () {
      var field = document.getElementById("star-field");
      for (var i = 0; i < 24; i++) {
        var s = document.createElement("span");
        var size = 2 + Math.random() * 3;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 4.5 + "s";
        s.style.animationDuration = 3.5 + Math.random() * 3 + "s";
        field.appendChild(s);
      }
    })();

    var MOTIF_STYLE = {
      star: { pose: "default", prop: "star" },
      moon: { pose: "sitting", prop: "star" },
      wing: { pose: "default", prop: "none" },
      flower: { pose: "default", prop: "leaf" },
      heart: { pose: "default", prop: "heart" },
      rainbow: { pose: "default", prop: "star" },
      crystal: { pose: "default", prop: "light" },
      light: { pose: "default", prop: "light" },
      cloud: { pose: "sitting", prop: "star" },
      book: { pose: "sitting", prop: "none" },
      candle: { pose: "sitting", prop: "light" },
      tree: { pose: "sitting", prop: "leaf" },
      bird: { pose: "default", prop: "none" },
      ocean: { pose: "default", prop: "light" },
    };

    function cardFaceMarkup(card, themeId) {
      var style = MOTIF_STYLE[card.motif] || MOTIF_STYLE.star;
      return (
        '<div class="card-face" style="--face-1:var(--card-' + card.palette + '-1); --face-2:var(--card-' + card.palette + '-2); --face-edge:var(--card-' + card.palette + '-edge);">' +
        '<span class="card-corner tl"></span><span class="card-corner tr"></span>' +
        '<span class="card-corner bl"></span><span class="card-corner br"></span>' +
        '<div class="card-inner">' +
        '<div class="card-scene-wrap">' + window.App.sceneBackgrounds.sceneMarkup(card.motif) + '</div>' +
        '<div class="card-scene-wrap">' + window.App.sceneBackgrounds.themeDecorMarkup(themeId) + '</div>' +
        '<div class="card-mascot-wrap">' + window.App.angelMascot.angelMascotSVG({ pose: style.pose, prop: style.prop, size: 132 }) + '</div>' +
        '<div class="card-number">No. ' + String(card.id).padStart(2, "0") + '</div>' +
        '<div class="card-title">' + card.title + '</div>' +
        '</div>' +
        '</div>'
      );
    }

    function hashToIndex(str, mod) {
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      }
      return hash % mod;
    }

    function todayKey() {
      var d = new Date();
      var pad = function (n) { return String(n).padStart(2, "0"); };
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    var key = todayKey();
    var ANGEL_NUMBERS = window.App.angelNumbers.ANGEL_NUMBERS;
    var THEMES = window.App.themes.THEMES;
    var number = ANGEL_NUMBERS[hashToIndex(key + "_number", ANGEL_NUMBERS.length)];
    var theme = THEMES[hashToIndex(key + "_theme", THEMES.length)];
    var reading = window.App.messageEngine.getReading(number, theme.id);

    var d = new Date();
    document.getElementById("todayDateLabel").textContent =
      d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日の数字です。";

    var shareText =
      "今日のエンジェルナンバーは【" + number + "】でした\n「" + reading.card.title + "」\n" + reading.summary +
      "\n\n#エンジェルナンバー #天使からのメッセージ";
    var SITE_URL = "https://amomojapam.github.io/angel-number-app/today.html";

    document.getElementById("todayContent").innerHTML =
      '<p class="result-ribbon">✧ ANGEL NUMBER ✧</p>' +
      '<p class="result-number">' + number + '</p>' +
      '<div class="result-theme-tag" style="--tint-bg:var(--theme-' + theme.accent + '-bg); --tint-fg:var(--theme-' + theme.accent + '-fg);">' +
      '<span>' + theme.icon + '</span><span>' + theme.label + '</span>' +
      '</div>' +
      '<div class="card-stage">' + cardFaceMarkup(reading.card, theme.id) + '</div>' +
      '<h2 class="section-title">✦ 今日のメッセージ</h2>' +
      '<div class="message-text">' +
      '<p style="font-weight:600;">' + reading.summary + '</p>' +
      reading.message.map(function (p) { return '<p>' + p + '</p>'; }).join("") +
      '</div>' +
      '<h2 class="section-title">✦ 天使からのアドバイス</h2>' +
      '<ul class="advice-list">' +
      reading.advice.map(function (a) { return '<li><span class="star">★</span><span>' + a + '</span></li>'; }).join("") +
      '</ul>' +
      '<div class="today-word">' +
      '<div class="section-title" style="justify-content:center;margin:0 0 6px;">✦ 今日のひとこと</div>' +
      '「' + reading.todayWord + '」' +
      '</div>' +
      '<div class="result-actions">' +
      '<a class="btn-share-x" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(SITE_URL) + '" target="_blank" rel="noopener noreferrer">𝕏 にシェアする</a>' +
      '</div>';
  </script>
</body>
</html>
